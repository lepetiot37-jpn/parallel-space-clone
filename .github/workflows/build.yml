name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer les dépendances système pour Buildozer / python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev automake build-essential ccache

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Buildozer et Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Mettre en cache les téléchargements Buildozer / SDK / NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Compiler l'APK (debug)
        env:
          CFLAGS: "-Wno-error=incompatible-function-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion"
          CXXFLAGS: "-Wno-error=incompatible-function-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion"
        run: |
          yes | buildozer -v android debug

      - name: Récupérer le nom de l'APK généré
        id: apk
        run: |
          APK_PATH=$(find bin -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Publier l'APK en tant qu'artefact du workflow
        uses: actions/upload-artifact@v4
        with:
          name: parallel-space-clone-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
