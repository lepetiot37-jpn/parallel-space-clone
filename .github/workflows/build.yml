name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Mettre en cache les téléchargements Buildozer / SDK / NDK
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-docker-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-docker-${{ runner.os }}-

      - name: Nettoyer le venv de build residuel
        run: |
          rm -rf .buildozer/android/platform/build-*/build/venv
          rm -rf .buildozer/android/platform/android-sdk

      - name: Compiler l'APK (debug) dans l'image Docker officielle Kivy
        run: |
          yes | docker run --rm -i \
            -v "${{ github.workspace }}":/home/user/hostcwd \
            -e PIP_CONSTRAINT=/home/user/hostcwd/pip-constraint.txt \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Récupérer le nom de l'APK généré
        id: apk
        run: |
          APK_PATH=$(find bin -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Publier l'APK en tant qu'artefact du workflow
        uses: actions/upload-artifact@v4
        with:
          name: parallel-space-clone-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
