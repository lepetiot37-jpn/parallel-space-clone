name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Mettre en cache les téléchargements Buildozer / SDK / NDK
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Compiler l'APK (debug) via conteneur buildozer maintenu
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Publier l'APK en tant qu'artefact du workflow
        uses: actions/upload-artifact@v4
        with:
          name: parallel-space-clone-debug-apk
          path: ${{ steps.buildozer.outputs.filename }}
          if-no-files-found: error
